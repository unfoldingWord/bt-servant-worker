# Fixture: [env] present but no MIMIR_USER — the regression that keeping the value out of
# fly secrets makes possible. The collector resolves ${env:MIMIR_USER} to "" and every
# export is a 401 from Mimir, healthily, forever.
app = "bt-servant-otel-collector"
primary_region = "iad"

[env]
  SOMETHING_ELSE = "unrelated"
