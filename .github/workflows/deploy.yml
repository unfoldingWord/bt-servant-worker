name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # This job deploys with NO --env flag, so the top-level [vars] block is what
      # reaches production. If ENVIRONMENT ever drifts back to "development", the deploy
      # still succeeds and prod telemetry silently lands in the wrong service.namespace —
      # exactly the bug production-otel.md B1 fixed. Fail loudly instead.
      - name: Assert production environment label
        run: |
          set -euo pipefail
          value="$(sed -n '/^\[vars\]/,/^\[/p' wrangler.toml | sed -n 's/^ENVIRONMENT *= *"\(.*\)"/\1/p')"
          echo "wrangler.toml top-level [vars] ENVIRONMENT = '$value'"
          if [ "$value" != "production" ]; then
            echo "::error file=wrangler.toml::top-level [vars] ENVIRONMENT must be \"production\" (got \"$value\")"
            exit 1
          fi

      # Tail consumer must exist before the producer worker references it
      # via tail_consumers in wrangler.toml — deploy it first.
      - name: Deploy Tail Worker (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config tail-worker/wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
