name: Deploy OTel Collector

# The collector is the telemetry pipe (infra/otel-collector/). It is NOT part of the
# Worker bundle, so the main CI/Deploy workflows never touch it — this workflow is its
# entire CI/CD.
#
# validate runs on every PR that touches the collector; deploy runs only on main.
# The M0 lesson: a config the collector rejects crash-loops the fly app on boot, and
# fly happily rolls it out anyway. So we validate with the EXACT pinned image before
# any deploy, and we pre-flight the fly secrets the config depends on.

on:
  push:
    branches: [main]
    paths:
      - 'infra/otel-collector/**'
      - '.github/workflows/deploy-collector.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/otel-collector/**'
      - '.github/workflows/deploy-collector.yml'
  workflow_dispatch:

# Least privilege: nothing here writes to the repo. The deploy jobs hand
# FLY_API_TOKEN to a third-party binary, so the ambient GITHUB_TOKEN should carry
# as little authority as possible alongside it.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the version is the Dockerfile's ARG — validating
      # against a different build than we ship would defeat the point.
      - name: Resolve pinned collector version
        id: otelcol
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG OTELCOL_VERSION=//p' infra/otel-collector/Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error file=infra/otel-collector/Dockerfile::could not parse ARG OTELCOL_VERSION"
            exit 1
          fi
          echo "Pinned collector version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Dummy env values: `validate` resolves every ${env:...} reference, so the real
      # secrets are irrelevant but the placeholders must be well-SHAPED (O2_ENDPOINT is
      # parsed as a URL). Nothing here is sensitive.
      - name: otelcol validate
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/infra/otel-collector:/cfg:ro" \
            -e OTEL_INGEST_TOKEN=validate-only \
            -e O2_ENDPOINT=https://validate-only.invalid/api/default \
            -e O2_AUTH="Basic dmFsaWRhdGUtb25seQ==" \
            -e INFLUX_TOKEN=validate-only \
            -e INFLUX_BUCKET=validate-only \
            "otel/opentelemetry-collector-contrib:${{ steps.otelcol.outputs.version }}" \
            validate --config /cfg/otel-collector-config.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # `validate` type-checks the config; it has no idea which values are
      # load-bearing for us. An unset or misspelled ${env:...} resolves to an empty
      # string and validate still exits 0 — a collector missing INFLUX_BUCKET boots
      # healthy and writes every metric to bucket="". Likewise it does not care
      # whether user_id is deleted, hashed, or forwarded untouched. Hence exact
      # assertions on the parsed YAML. The deploy jobs guard the fly-secret side.
      - name: Assert collector invariants
        run: python3 .github/scripts/assert-collector-invariants.py infra/otel-collector/otel-collector-config.yaml

  deploy-staging:
    name: Deploy Collector (Staging)
    needs: [validate]
    # Deploy ONLY from main. workflow_dispatch lets a caller pick any branch, so
    # `event_name != pull_request` alone would ship unmerged refs to a live app.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    # Keyed on the APP, not github.ref — two dispatched refs sharing a ref-scoped
    # group would still race onto the same fly app.
    concurrency:
      group: deploy-collector-app-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Pinned to a reviewed commit, not @master: this action installs the flyctl
      # binary that is handed FLY_API_TOKEN two steps later, so a mutable upstream
      # tag is a path to the deployment credential. Bump deliberately.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master @ 2026-04-08

      - name: Resolve app name
        id: app
        working-directory: infra/otel-collector
        run: |
          set -euo pipefail
          app="$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml)"
          if [ -z "$app" ]; then
            echo "::error file=infra/otel-collector/fly.toml::could not parse app name"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Pre-flight required secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: .github/scripts/check-collector-secrets.sh "${{ steps.app.outputs.app }}"

      - name: Deploy
        working-directory: infra/otel-collector
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml

  deploy-production:
    name: Deploy Collector (Production)
    needs: [validate]
    # Skipped until the prod collector app exists (production-otel.md B3 step 1).
    # Provision it, then set the FLY_PROD_COLLECTOR_APP repo variable to its app name
    # and this job starts deploying — no workflow edit needed. B2 may replace the
    # --app override with a dedicated fly.prod.toml.
    if: github.ref == 'refs/heads/main' && vars.FLY_PROD_COLLECTOR_APP != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-collector-app-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Pinned for the same reason as the staging job — see the comment there.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master @ 2026-04-08

      - name: Pre-flight required secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: .github/scripts/check-collector-secrets.sh "${{ vars.FLY_PROD_COLLECTOR_APP }}"

      - name: Deploy
        working-directory: infra/otel-collector
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml --app "${{ vars.FLY_PROD_COLLECTOR_APP }}"
