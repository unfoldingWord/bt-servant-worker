name: Deploy Staging

# Staging follows the develop branch only: it deploys after CI succeeds on a
# push to develop. PR branches never deploy here (a PR branch once advanced
# staging's Durable Object migration past main and froze every later deploy).
# The branch filter alone is not enough: a release PR (develop → main) runs CI
# with head branch develop too, so the job also requires the CI run to have
# been triggered by a push. Otherwise each merge into develop deploys twice.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [develop]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm check

      - name: Type check (tail worker)
        run: pnpm check:tail

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Tail consumer must exist before the producer worker references it
      # via tail_consumers in wrangler.toml — deploy it first.
      - name: Deploy Tail Worker (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config tail-worker/wrangler.toml --env staging

      - name: Deploy to Staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
