# fly.io app for self-hosted OpenObserve (the telemetry sink: store + web UI in one binary)
# — STAGING. The production instance is fly.prod.toml, a separate app: OpenObserve OSS has
# `rbac_enabled: false`, so a shared instance would give every login read access to
# production data.
app = "bt-servant-openobserve"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Pin the image at deploy time (do NOT ship :latest):
  #   fly deploy --build-arg OPENOBSERVE_VERSION=<stable-tag>

[env]
  ZO_DATA_DIR = "/data"          # local-disk storage on the mounted volume (below).
  # Staging stays on local disk; prod uses R2 via ZO_S3_* (see fly.prod.toml).

  # Bound the retention. Left unset this defaults to 3650 — ten years — which is what
  # this instance has been reporting and nobody intended. Staging data has no value past
  # the sprint that produced it. Minimum accepted by OpenObserve is 3.
  #
  # NOTE: this directory has no CI/CD, so this line changes nothing until someone
  # hand-deploys the app; and retention already set per-stream in the UI overrides it.
  ZO_COMPACT_DATA_RETENTION_DAYS = "7"

[http_service]
  internal_port = 5080           # OpenObserve HTTP + UI; fly terminates TLS on 443.
  force_https = true
  auto_stop_machines = "off"     # keep the store queryable + able to receive ingest.
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "openobserve_data"    # `fly volumes create openobserve_data --size 3` first.
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
