# OpenTelemetry Collector — bt-servant-worker telemetry pipe (fly.io)
#
# One bearer-authed OTLP/HTTP receiver exports every signal to OpenObserve
# (self-hosted on fly); metrics ALSO fan out to Grafana Mimir (door43). Kept as a
# collector (not worker→sink direct) so sinks are added/changed HERE ONLY — the
# worker never redeploys.
#
# All ${env:...} values come from fly secrets or `fly.toml [env]` (see README).
# Nothing secret in git.

extensions:
  # Validates the shared secret the worker sends as `Authorization: Bearer <token>`.
  # fly terminates TLS in front of us, so this bearer check is what actually gates ingest.
  bearertokenauth/server:
    scheme: Bearer
    token: ${env:OTEL_INGEST_TOKEN}

  # CLIENT credentials for the Mimir exporter below. door43 maps each Basic-auth username
  # to a fixed Mimir org (tenant), so the USERNAME is what selects where metrics land:
  # staging authenticates as `bt-servant-staging`, prod as `bt-servant`. It is an org
  # identifier, not a credential, and lives in each app's `fly.toml [env]` where the
  # app↔org pairing is diffable and asserted by `assert-collector-invariants.py`. Only
  # the password is a fly secret. No default on purpose — an unset username resolves to
  # "" and every export becomes a 401 while the collector stays healthy, which is why the
  # deploy pre-flight checks the secret and the invariant script checks the [env].
  basicauth/mimir:
    client_auth:
      username: ${env:MIMIR_USER}
      password: ${env:MIMIR_PASSWORD}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/server

processors:
  # Keep a small fly machine from OOMing on a burst. MUST be first.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Defense-in-depth redaction: the worker already redacts at source, but if a new
  # call site ever leaks a sensitive attribute, drop/hash it here before egress too.
  attributes/redact:
    actions:
      - { key: authorization, action: delete }
      - { key: token, action: delete }
      - { key: api_key, action: delete }
      - { key: apikey, action: delete }
      - { key: password, action: delete }
      - { key: secret, action: delete }
      - { key: cookie, action: delete }
      # DELETE, not hash. The collector's `hash` is an UNSALTED digest — reversible by
      # brute force for enumerable ids (phone numbers). The worker now emits a properly
      # salted `user_hash` (HMAC-SHA-256, secret `TELEMETRY_USER_ID_SALT`) alongside the
      # raw id, so the joinable pseudonym already exists downstream and the raw id is
      # pure liability here. Never weaken this back to `hash`.
      - { key: user_id, action: delete }

  # ── Temporality bridge for the Mimir pipeline ONLY ──
  # The worker emits DELTA metrics on purpose: Worker isolates are ephemeral and each
  # drains its measurements once per invocation (see src/services/telemetry/metrics.ts).
  # Mimir is Prometheus-shaped and expects CUMULATIVE; its native delta ingestion is an
  # experimental server-side flag we do not depend on. This processor accumulates the
  # deltas in memory and re-emits running totals.
  #
  # IT IS ONLY CORRECT WITH ONE PRODUCER PER STREAM, DELIVERED IN ORDER. The processor
  # keys state by resource+scope+metric+attributes and DROPS any point whose start is
  # older than the stored stream's (ErrOlderStart) or whose timestamp is not strictly
  # later (ErrOutOfOrder). Two guarantees from the worker make that hold:
  #   1. every isolate stamps its own `service.instance.id` on the metrics resource, so
  #      concurrent isolates are separate streams rather than one interleaved one;
  #   2. an isolate serializes its flushes (the next POST starts only after the previous
  #      one was acknowledged), so a single stream's deltas arrive in collection order.
  # The collector holds up its end by running this processor BEFORE `batch`: the OTLP
  # receiver only acknowledges a POST after the synchronous processors have consumed it,
  # so "acknowledged" means "already folded into the cumulative state". Moving it after
  # `batch` would break that, which is why `assert-collector-invariants.py` asserts the
  # order. Mimir then sees one cumulative series per isolate (`instance=<uuid>`); query
  # with `sum by (...) (rate(...))`. A collector restart, or an isolate going idle past
  # max_stale, reads as a counter reset, which rate()/increase() handle.
  #
  # NOT on the OpenObserve pipeline: OpenObserve ingests delta as-is and its dashboards
  # were built on that; converting there would change what they show.
  #
  # max_stale: how long an idle stream is kept before being forgotten (default 5m). 1h
  # keeps a live-but-quiet isolate's stream intact; memory is streams × isolates seen in
  # the last hour at bounded label cardinality, trivial here. max_streams is left
  # unbounded on purpose: a hit cap drops NEW streams silently, and memory_limiter
  # already guards the machine.
  deltatocumulative:
    max_stale: 1h

  # ── OpenObserve pipeline ONLY: drop the per-isolate id ──
  # `service.instance.id` exists for the Mimir leg (see above). OpenObserve never needed
  # it, and keeping it there would turn every isolate into its own series set. Deleting
  # it here keeps what OpenObserve receives byte-for-byte what it received before the
  # Mimir move. A `resource` processor, not `attributes`: it is a resource attribute.
  resource/strip_instance:
    attributes:
      - { key: service.instance.id, action: delete }

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # ── Sink #1: OpenObserve (self-hosted) ── routes by `stream-name` header per signal.
  # endpoint is the org base; otlp_http appends /v1/{traces,logs,metrics}.
  otlp_http/openobserve_traces:
    endpoint: ${env:O2_ENDPOINT} # e.g. https://bt-servant-openobserve.fly.dev/api/default
    headers:
      Authorization: ${env:O2_AUTH} # O2_AUTH = "Basic <base64(user:token)>"
      stream-name: traces
  otlp_http/openobserve_logs:
    endpoint: ${env:O2_ENDPOINT}
    headers:
      Authorization: ${env:O2_AUTH}
      stream-name: logs
  otlp_http/openobserve_metrics:
    endpoint: ${env:O2_ENDPOINT}
    headers:
      Authorization: ${env:O2_AUTH} # metrics auto-stream, no stream-name

  # ── Sink #2 (metrics only): Grafana Mimir via door43 ──
  # Mimir has a native OTLP/HTTP receiver, so this is a plain otlp_http exporter.
  # `metrics_endpoint` is the FULL URL door43 published (used as-is, nothing appended),
  # rather than `endpoint` + an implied /v1/metrics — so the config says exactly what
  # the proxy expects and nothing else. Auth goes THROUGH the basicauth/mimir extension
  # (not an ad-hoc `headers:` entry) so the username that selects the org is the one
  # value the invariant script asserts; `assert-collector-invariants.py` fails the build
  # if this exporter does not authenticate via that extension. Replaced the InfluxDB 3
  # line-protocol exporter when door43 retired Influx.
  otlp_http/mimir_metrics:
    metrics_endpoint: https://mimir.door43.org/otlp/v1/metrics
    auth:
      authenticator: basicauth/mimir

  # DELIBERATELY NOT WIRED INTO ANY PIPELINE, and it must stay that way:
  # `assert-collector-invariants.py` FAILS if `debug` appears in any pipeline, and every
  # deploy job depends on that gate. So do NOT "just append it for a bring-up" — that
  # config cannot be deployed, and hand-deploying around the gate is the anti-pattern the
  # CI/CD boundary exists to prevent. `verbosity: detailed` is also far too expensive
  # under real traffic.
  #
  # To prove a new environment's pipe, use `tools/send_trace.sh` (a real span + a unique
  # marker to query in the sink) — see infra/otel-collector/README.md "Prove it". If
  # record-level stdout is ever genuinely required, relax the assertion and wire this
  # exporter in ONE reviewed PR, ship it through the workflow, then revert it.
  #
  # Kept defined (not deleted) so that exception is a two-line diff rather than a rewrite.
  debug:
    verbosity: detailed

service:
  extensions: [bearertokenauth/server, basicauth/mimir]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp_http/openobserve_traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp_http/openobserve_logs]
    # Metrics fan out via TWO pipelines off the same receiver rather than one pipeline with
    # two exporters, because only the Mimir leg needs the delta→cumulative conversion (and
    # only the OpenObserve leg strips the per-isolate id) and a processor applies to every
    # exporter in its pipeline. Both run attributes/redact — the invariant script requires
    # the user_id delete on EVERY pipeline. deltatocumulative MUST precede batch (asserted).
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource/strip_instance, batch]
      exporters: [otlp_http/openobserve_metrics]
    metrics/mimir:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, deltatocumulative, batch]
      exporters: [otlp_http/mimir_metrics]
  telemetry:
    logs:
      level: info
