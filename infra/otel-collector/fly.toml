# fly.io app for the OpenTelemetry Collector — STAGING.
# The production app is fly.prod.toml; both deploy the same config from the same image,
# and this [env] block is the only difference between them.
app = "bt-servant-otel-collector"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Pin the collector version at build time:
  #   fly deploy --build-arg OTELCOL_VERSION=<stable-tag>

[env]
  # The Mimir (door43) username this app authenticates as. door43 maps each username to a
  # fixed Mimir org, so this is what decides where the metrics land. NOT a secret — it is
  # an org identifier, and only the paired MIMIR_PASSWORD is sensitive. It lives here
  # rather than in fly secrets because it is the single value that distinguishes staging
  # from production, and as a secret it would be invisible: `fly secrets list` shows a
  # digest, never the value, so nothing could tell you which org an app was really
  # writing to. `assert-collector-invariants.py` asserts this matches the app above.
  #
  # A fly SECRET of the same name takes precedence over this block. If `flyctl secrets list
  # --app bt-servant-otel-collector` ever shows MIMIR_USER, that leftover is what the
  # collector is using and this line is dead — `flyctl secrets unset MIMIR_USER`. The
  # deploy pre-flight fails on exactly that.
  MIMIR_USER = "bt-servant-staging"

[http_service]
  internal_port = 4318          # OTLP/HTTP; fly terminates TLS on 443 in front of this
  force_https = true
  # A telemetry pipe must be available whenever the worker emits — do not scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # ...and EXACTLY one, never more. The Mimir pipeline's `deltatocumulative` keeps each
  # series' running total in the memory of one collector process, and fly load-balances
  # requests across machines with no affinity. A second machine is a second converter: an
  # isolate's deltas get split between them, both emit the same series with partial values,
  # and Mimir rejects the later sample as out-of-order (seen 2026-10-12). fly.toml has no
  # "max machines" key, so the deploy workflow passes `--ha=false` and then runs
  # `.github/scripts/pin-collector-machines.sh`, which scales to one and fails the deploy
  # if the app has anything else. Do NOT `fly scale count 2` for HA; the cost of one
  # machine is a ten-to-twenty-second restart gap per deploy, which the worker logs.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
