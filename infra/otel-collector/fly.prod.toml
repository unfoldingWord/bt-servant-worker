# fly.io app for the OpenTelemetry Collector — PRODUCTION.
#
# Identical to fly.toml except for `app` and the bucket in [env]. Same Dockerfile, same
# otel-collector-config.yaml, same pins — one config file serving two apps is the whole
# reason the environment-specific values are parameterized (B1).
#
# The app does not exist yet: `fly launch --no-deploy` creates it, then CI performs the
# first deploy. Never `fly deploy` this from a laptop, including that first one — see
# README.md "There is no bootstrap exception".
app = "bt-servant-otel-collector-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Pin the collector version at build time:
  #   fly deploy --build-arg OTELCOL_VERSION=<stable-tag>

[env]
  # Production door43 bucket. See the longer note in fly.toml for why this is [env] and
  # not a fly secret, and for the shadowing trap. Do NOT set INFLUX_BUCKET as a secret on
  # this app — a secret silently wins over this line, which is precisely the invisible
  # bucket↔environment mapping the move was made to eliminate.
  INFLUX_BUCKET = "bt-servant"

[http_service]
  internal_port = 4318          # OTLP/HTTP; fly terminates TLS on 443 in front of this
  force_https = true
  # A telemetry pipe must be available whenever the worker emits — do not scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Matches staging deliberately: the collector batches and forwards, it does not store or
  # query. Its memory_limiter is percentage-based, so it adapts if this is ever raised.
  size = "shared-cpu-1x"
  memory = "512mb"
